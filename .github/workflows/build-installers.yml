name: Build installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build-windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run icons
      - run: npm run build:exe --workspace=downai-app
      - uses: actions/upload-artifact@v4
        with:
          name: downai-windows
          path: packages/meridian-app/release/DownAI-Setup-*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run icons
      - run: npm run build:mac --workspace=downai-app
      - uses: actions/upload-artifact@v4
        with:
          name: downai-macos
          path: |
            packages/meridian-app/release/DownAI-*.dmg
            packages/meridian-app/release/DownAI-*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/downai-windows/*
            artifacts/downai-macos/*
          generate_release_notes: true
